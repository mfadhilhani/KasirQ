<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table HTML</title>
</head>

<body>

    <!-- Membuat Tabel Sederhana di HTML -->
    <table border="1">
        <!-- Semantic Table thead tbody tfoot -->
        <thead>
            <tr>
                <th>Negara</th>
                <th>Ibukota</th>
                <td>Populasi</td>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Tiongkok</td>
                <td>Bejing</td>
                <td>20 juta</td>
            </tr>

            <tr>
                <td>Rusia</td>
                <td>moskow</td>
                <td>11 juta</td>
            </tr>
        </tbody>
        <tfoot>

            <tr>
                <th colspan="2">Total</th>
                <th>31 juta</th>
            </tr>
        </tfoot>


    </table>
    <hr>
    <!-- Menggabungkan Kolom dan Barus di Tabel HTML
-->
    <table border="1">
        <thead>
            <tr>
                <th rowspan="2">Tahun</th>
                <th colspan="3">Morris (2010)</th>
            </tr>
            <tr>
                <th>Populasi</th>
                <th>Nama</th>
                <th>Lokasi Sekarang</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="3">700 SM</td>
                <td rowspan="3">1000</td>
                <td>Beida</td>
                <td>Yordania</td>

            </tr>
            <tr>
                <td>Beida</td>
                <td>Yordania</td>
            </tr>
            <tr>
                <td>Beida</td>
                <td>Yordania</td>
            </tr>
        </tbody>
    </table>
    <hr>


</body>

</html>
